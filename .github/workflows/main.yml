name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Build chat service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-svc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-svc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read service version
        id: svc_version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./chat-svc
          file: ./chat-svc/Dockerfile
          push: false
          build-args: |
            APP_VERSION=${{ steps.svc_version.outputs.version }}
          tags: tuananh1001lk/thanos-svc:${{ steps.svc_version.outputs.version }}

  frontend:
    name: Build chat web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read web version
        id: web_version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./chat-web
          file: ./chat-web/Dockerfile
          push: false
          build-args: |
            APP_VERSION=${{ steps.web_version.outputs.version }}
          tags: tuananh1001lk/thanos-web:${{ steps.web_version.outputs.version }}
  
  publish:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read backend version
        id: svc_version
        working-directory: chat-svc
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Read frontend version
        id: web_version
        working-directory: chat-web
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./chat-svc
          file: ./chat-svc/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.svc_version.outputs.version }}
          tags: |
            tuananh1001lk/thanos-svc:${{ steps.svc_version.outputs.version }}
            tuananh1001lk/thanos-svc:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./chat-web
          file: ./chat-web/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.web_version.outputs.version }}
          tags: |
            tuananh1001lk/thanos-web:${{ steps.web_version.outputs.version }}
            tuananh1001lk/thanos-web:latest
