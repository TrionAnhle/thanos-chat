name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Chat Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-svc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-svc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend:
    name: Chat Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
  
    deploy:
      name: Deploy Prod
      runs-on: ubuntu-latest
      needs: [backend, frontend]
      if: github.ref == 'refs/heads/prod'
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Deploy
          run: echo "Deploying to prod... replace with real deployment commands"

